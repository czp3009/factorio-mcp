name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Read version and platforms
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      kotlin-version: ${{ steps.metadata.outputs.kotlin-version }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-metadata-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle.kts', 'gradle/*.toml', 'gradle.properties', 'buildSrc/src/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-metadata-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Read Gradle version and enabled matrix
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          properties="$(./gradlew --no-daemon --console=plain -q properties --property version)"
          version="$(printf '%s\n' "$properties" | sed -n 's/^version: //p')"
          if [[ "$version" == unspecified || ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Invalid Gradle release version: $version" >&2
            exit 1
          fi
          kotlin_version="$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["kotlin"])')"
          matrix="$(jq -c '{include: map(select(.enabled))}' .github/release-platforms.json)"
          jq -e '.include | length > 0' <<< "$matrix" > /dev/null
          printf 'version=%s\nkotlin-version=%s\nmatrix=%s\n' "$version" "$kotlin_version" "$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.id }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle.kts', 'gradle/*.toml', 'gradle.properties', 'buildSrc/src/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Cache Kotlin Native compiler and dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.kotlin-version }}-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.kotlin-version }}-

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC build tools were not found' }
          & "$installation/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          ./gradlew.bat --no-daemon --console=plain build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew --no-daemon --console=plain build

      - name: Collect release binaries
        shell: bash
        env:
          RELEASE_DIRECTORY: build/bin/${{ matrix.target }}/releaseExecutable
          PLATFORM: ${{ matrix.id }}
        run: |
          set -euo pipefail
          test -d "$RELEASE_DIRECTORY"
          test -n "$(find "$RELEASE_DIRECTORY" -type f -print -quit)"
          if [[ "$PLATFORM" == windows-x64 ]]; then
            test -s "$RELEASE_DIRECTORY/factorio-mcp.exe"
            test -s "$RELEASE_DIRECTORY/factorio_bridge.dll"
          fi
          # Preserve executable permissions across the artifact handoff for Unix targets.
          mkdir -p build/release-handoff
          tar -cf build/release-handoff/runtime.tar -C "$RELEASE_DIRECTORY" .

      - name: Upload release binaries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-${{ matrix.id }}
          path: build/release-handoff/runtime.tar
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tests-${{ matrix.id }}
          path: |
            build/reports/tests/
            build/test-results/
            build/native-tests/**/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Package and publish
    needs: [ prepare, build ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_MATRIX: ${{ needs.prepare.outputs.matrix }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download all successful builds
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: runtime-*
          path: artifacts

      - name: Package one ZIP per platform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r platform; do
            directory="$RUNNER_TEMP/package-$platform"
            mkdir -p "$directory"
            tar -xf "artifacts/runtime-$platform/runtime.tar" -C "$directory"
            (cd "$directory" && zip -r "$GITHUB_WORKSPACE/dist/factorio-mcp-$VERSION-$platform.zip" .)
          done < <(jq -r '.include[].id' <<< "$BUILD_MATRIX")

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag")"
          if jq -e --arg ref "refs/tags/$tag" 'any(.[]; .ref == $ref)' <<< "$refs" > /dev/null; then
            echo "Tag $tag already exists; update the Gradle version before publishing." >&2
            exit 1
          fi
          gh release create "$tag" dist/*.zip \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes

name: Publishing pipeline

on:
  workflow_call:
    inputs:
      github-release:
        type: boolean
        default: false
      npm:
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: publishing
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      github-release: ${{ inputs.github-release }}
      npm: ${{ inputs.npm }}

  publish-npm:
    name: Publish npm packages
    if: inputs.npm
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: npm-*
          path: packages
          merge-multiple: true

      - name: Publish platform packages, then the launcher
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo 'Configure the NPM_TOKEN repository secret before publishing npm packages.' >&2
            exit 1
          fi
          shopt -s nullglob
          # Read package metadata, not artifact filenames, to distinguish the launcher.
          main=()
          platforms=()
          for archive in ./packages/*.tgz; do
            metadata="$(tar -xOf "$archive" package/package.json)"
            if jq -e '.kotlinNativeNpmPublishing.platformPackages' <<< "$metadata" > /dev/null; then
              main+=("$archive")
            else
              platforms+=("$archive")
            fi
          done
          test "${#main[@]}" -eq 1
          test "${#platforms[@]}" -gt 0
          launcher="$(tar -xOf "${main[0]}" package/package.json)"
          expected="$(jq -ce '.kotlinNativeNpmPublishing.platformPackages | to_entries | sort_by(.value)' <<< "$launcher")"
          version="$(jq -er '.version' <<< "$launcher")"
          test "$version" = "$BUILD_VERSION"
          # Validate the complete set before publishing any package. Duplicate, stale or missing runtime
          # artifacts must not result in a launcher that installs only on a subset of the declared platforms.
          jq -e --argjson expected "$expected" --arg version "$version" '
            .optionalDependencies == ($expected | map({key: .value, value: $version}) | from_entries)
          ' <<< "$launcher" > /dev/null
          actual=()
          for archive in "${platforms[@]}"; do
            metadata="$(tar -xOf "$archive" package/package.json)"
            name="$(jq -er '.name' <<< "$metadata")"
            platform="$(jq -er --arg name "$name" '.[] | select(.value == $name) | .key' <<< "$expected")"
            os="${platform%-*}"
            cpu="${platform##*-}"
            jq -e --arg version "$version" --arg os "$os" --arg cpu "$cpu" '
              .version == $version and .os == [$os] and .cpu == [$cpu]
            ' <<< "$metadata" > /dev/null
            actual+=("$name")
          done
          actual_names="$(printf '%s\n' "${actual[@]}" | jq -Rsc 'split("\n")[:-1] | sort')"
          expected_names="$(jq -c 'map(.value) | sort' <<< "$expected")"
          if [[ "$actual_names" != "$expected_names" ]]; then
            echo "Runtime package set does not match the launcher dependencies." >&2
            exit 1
          fi
          for archive in "${platforms[@]}" "${main[@]}"; do
            npm publish "$archive" --access public
          done

  publish-release:
    name: Publish GitHub Release
    if: inputs.github-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      BUILD_MATRIX: ${{ needs.build.outputs.matrix }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download all successful builds
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: runtime-*
          path: artifacts
          merge-multiple: true

      - name: Package one ZIP per platform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r platform; do
            directory="$RUNNER_TEMP/package-$platform"
            mkdir -p "$directory"
            tar -xf "artifacts/runtime-$platform.tar" -C "$directory"
            (cd "$directory" && zip -r "$GITHUB_WORKSPACE/dist/factorio-mcp-$VERSION-$platform.zip" .)
          done < <(jq -r '.include[].id' <<< "$BUILD_MATRIX")

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag")"
          if jq -e --arg ref "refs/tags/$tag" 'any(.[]; .ref == $ref)' <<< "$refs" > /dev/null; then
            echo "Tag $tag already exists; update the Gradle version before publishing." >&2
            exit 1
          fi
          gh release create "$tag" dist/*.zip \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes

name: Build implementation

on:
  workflow_call:
    inputs:
      github:
        type: boolean
        default: false
      npm:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}
      matrix:
        value: ${{ jobs.prepare.outputs.matrix }}

permissions:
  contents: read

jobs:
  prepare:
    name: Read version and platforms
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      kotlin-version: ${{ steps.metadata.outputs.kotlin-version }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Read Gradle version and enabled matrix
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(./gradlew --no-daemon --console=plain -q printVersion)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?(\+([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?$ ]]; then
            echo "Invalid Gradle release version: $version" >&2
            exit 1
          fi
          release_version="${version%%+*}"
          if [[ "$release_version" == *-* ]]; then
            IFS=. read -ra identifiers <<< "${release_version#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "Numeric prerelease identifiers cannot have leading zeros: $version" >&2
                exit 1
              fi
            done
          fi
          kotlin_version="$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["kotlin"])')"
          matrix="$(jq -c '{include: map(select(.enabled))}' .github/release-platforms.json)"
          jq -e '.include | length > 0' <<< "$matrix" > /dev/null
          printf 'version=%s\nkotlin-version=%s\nmatrix=%s\n' "$version" "$kotlin_version" "$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.id }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Kotlin Native compiler and dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.kotlin-version }}-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.kotlin-version }}-

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FACTORIO_MCP_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC build tools were not found' }
          & "$installation/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          # Capture this explicit SDK setup into project configuration before starting Gradle.
          $env:FACTORIO_MCP_WINDOWS_NATIVE_INCLUDE_DIRECTORIES = $env:INCLUDE
          $env:FACTORIO_MCP_WINDOWS_NATIVE_LIBRARY_DIRECTORIES = $env:LIB
          $target = $env:FACTORIO_MCP_TARGET.Substring(0, 1).ToUpperInvariant() + $env:FACTORIO_MCP_TARGET.Substring(1)
          ./gradlew.bat --no-daemon --console=plain build "verifyNpm${target}Package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          FACTORIO_MCP_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          target="$(printf '%s' "${FACTORIO_MCP_TARGET:0:1}" | tr '[:lower:]' '[:upper:]')${FACTORIO_MCP_TARGET:1}"
          ./gradlew --no-daemon --console=plain build "verifyNpm${target}Package"

      - name: Collect release binaries
        if: inputs.github
        shell: bash
        env:
          FACTORIO_MCP_RELEASE_DIRECTORY: build/bin/${{ matrix.target }}/releaseExecutable
          FACTORIO_MCP_PLATFORM: ${{ matrix.id }}
        run: |
          set -euo pipefail
          test -d "$FACTORIO_MCP_RELEASE_DIRECTORY"
          test -n "$(find "$FACTORIO_MCP_RELEASE_DIRECTORY" -type f -print -quit)"
          if [[ "$FACTORIO_MCP_PLATFORM" == windows-x64 ]]; then
            test -s "$FACTORIO_MCP_RELEASE_DIRECTORY/factorio-mcp.exe"
            test -s "$FACTORIO_MCP_RELEASE_DIRECTORY/factorio_bridge.dll"
          elif [[ "$FACTORIO_MCP_PLATFORM" == linux-x64 ]]; then
            test -x "$FACTORIO_MCP_RELEASE_DIRECTORY/factorio-mcp.kexe"
            test -s "$FACTORIO_MCP_RELEASE_DIRECTORY/libfactorio_mcp_resident.so"
          fi
          # Preserve executable permissions across the artifact handoff for Unix targets.
          mkdir -p build/release-handoff
          tar -cf "build/release-handoff/runtime-$FACTORIO_MCP_PLATFORM.tar" -C "$FACTORIO_MCP_RELEASE_DIRECTORY" .

      - name: Upload release binaries
        if: inputs.github
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-${{ matrix.id }}
          path: build/release-handoff/runtime-${{ matrix.id }}.tar
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7.0.1
        if: inputs.npm
        with:
          name: npm-runtime-${{ matrix.id }}
          path: build/reports/npm/${{ matrix.target }}/platform/*.tgz
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7.0.1
        if: inputs.npm && runner.os == 'Linux'
        with:
          name: npm-main
          path: build/reports/npm/${{ matrix.target }}/main/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tests-${{ matrix.id }}
          path: |
            build/reports/tests/
            build/test-results/
            build/native-tests/**/Testing/Temporary/
            build/reports/npm/${{ matrix.target }}/*.log
            build/reports/npm/${{ matrix.target }}/*.stderr
            build/reports/npm/${{ matrix.target }}/*.jsonl
            build/reports/npm/${{ matrix.target }}/*.txt
            build/reports/npm/${{ matrix.target }}/*/pack.json*
          if-no-files-found: ignore
          retention-days: 7

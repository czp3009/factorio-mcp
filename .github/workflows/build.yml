name: Build pipeline

on:
  workflow_call:
    inputs:
      github-release:
        type: boolean
        default: false
      npm:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}
      matrix:
        value: ${{ jobs.prepare.outputs.matrix }}

permissions:
  contents: read

jobs:
  prepare:
    name: Read version and platforms
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      kotlin-version: ${{ steps.metadata.outputs.kotlin-version }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-metadata-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle.kts', 'gradle/*.toml', 'gradle.properties', 'buildSrc/src/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-metadata-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Read Gradle version and enabled matrix
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(./gradlew --no-daemon --console=plain -q printVersion)"
          if [[ "$version" == unspecified || ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Invalid Gradle release version: $version" >&2
            exit 1
          fi
          kotlin_version="$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["kotlin"])')"
          matrix="$(jq -c '{include: map(select(.enabled))}' .github/release-platforms.json)"
          jq -e '.include | length > 0' <<< "$matrix" > /dev/null
          printf 'version=%s\nkotlin-version=%s\nmatrix=%s\n' "$version" "$kotlin_version" "$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7.0.0
        if: inputs.npm
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Package npm launcher
        if: inputs.npm
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain generateKotlinNativeNpmMainPackage
          expected="$(jq -c '[.[] | select(.enabled) | .id | sub("^windows-"; "win32-") | sub("^macos-"; "darwin-")] | sort' .github/release-platforms.json)"
          actual="$(jq -c '.kotlinNativeNpmPublishing.platformPackages | keys' build/kotlinNativeNpmPublishing/main/package.json)"
          if [[ "$actual" != "$expected" ]]; then
            echo "npm launcher platforms ($actual) do not match the release matrix ($expected)." >&2
            exit 1
          fi
          mkdir -p build/npm
          npm pack ./build/kotlinNativeNpmPublishing/main --pack-destination build/npm

      - uses: actions/upload-artifact@v7.0.1
        if: inputs.npm
        with:
          name: npm-main
          path: build/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and test (${{ matrix.id }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle.kts', 'gradle/*.toml', 'gradle.properties', 'buildSrc/src/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-build-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Cache Kotlin Native compiler and dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.kotlin-version }}-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.kotlin-version }}-

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GENERATE_NPM: ${{ inputs.npm }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC build tools were not found' }
          & "$installation/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $tasks = @('build')
          if ($env:GENERATE_NPM -eq 'true') {
            $target = $env:TARGET.Substring(0, 1).ToUpperInvariant() + $env:TARGET.Substring(1)
            $tasks += "generateKotlinNativeNpm${target}Package"
          }
          ./gradlew.bat --no-daemon --console=plain @tasks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          GENERATE_NPM: ${{ inputs.npm }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tasks=(build)
          if [[ "$GENERATE_NPM" == true ]]; then
            target="$(printf '%s' "${TARGET:0:1}" | tr '[:lower:]' '[:upper:]')${TARGET:1}"
            tasks+=("generateKotlinNativeNpm${target}Package")
          fi
          ./gradlew --no-daemon --console=plain "${tasks[@]}"

      - name: Collect release binaries
        if: inputs.github-release
        shell: bash
        env:
          RELEASE_DIRECTORY: build/bin/${{ matrix.target }}/releaseExecutable
          PLATFORM: ${{ matrix.id }}
        run: |
          set -euo pipefail
          test -d "$RELEASE_DIRECTORY"
          test -n "$(find "$RELEASE_DIRECTORY" -type f -print -quit)"
          if [[ "$PLATFORM" == windows-x64 ]]; then
            test -s "$RELEASE_DIRECTORY/factorio-mcp.exe"
            test -s "$RELEASE_DIRECTORY/factorio_bridge.dll"
          elif [[ "$PLATFORM" == linux-x64 ]]; then
            test -x "$RELEASE_DIRECTORY/factorio-mcp.kexe"
            test -s "$RELEASE_DIRECTORY/libfactorio_mcp_resident.so"
          fi
          # Preserve executable permissions across the artifact handoff for Unix targets.
          mkdir -p build/release-handoff
          tar -cf "build/release-handoff/runtime-$PLATFORM.tar" -C "$RELEASE_DIRECTORY" .

      - name: Upload release binaries
        if: inputs.github-release
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-${{ matrix.id }}
          path: build/release-handoff/runtime-${{ matrix.id }}.tar
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-node@v7.0.0
        if: inputs.npm
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Package native npm runtime
        if: inputs.npm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/npm
          for directory in build/kotlinNativeNpmPublishing/platforms/*; do
            npm pack "./$directory" --pack-destination build/npm
          done

      - uses: actions/upload-artifact@v7.0.1
        if: inputs.npm
        with:
          name: npm-${{ matrix.id }}
          path: build/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tests-${{ matrix.id }}
          path: |
            build/reports/tests/
            build/test-results/
            build/native-tests/**/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
